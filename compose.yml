services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: pos
      MYSQL_USER: pos
      MYSQL_PASSWORD: "p@ss:w/rd"
    ports: ["127.0.0.1:33306:3306"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: "p@ss:w/rd"
    ports: ["127.0.0.1:35432:5432"]
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: pos
      MONGO_INITDB_ROOT_PASSWORD: "p@ss:w/rd"
    ports: ["127.0.0.1:37017:27017"]
