[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ilesandres", "Claude (Anthropic)"]

[workspace.dependencies]
pos-domain = { path = "crates/domain" }
pos-config = { path = "crates/config" }
pos-storage = { path = "crates/storage" }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-float"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
result_large_err = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
